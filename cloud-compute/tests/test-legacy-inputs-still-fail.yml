name: Test removed action fails even with legacy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: dummy-api-token
          app-url: http://localhost:3000
          head-sha: 0000000000000000000000000000000000000000
          secure-tunnel-host: tunnel.example.com
          rewrite-hostname-to-app-url: "true"
          proxy-all-urls: "false"
          companion-assets-folder: dist
          companion-assets-regex: ".*\\.js$"
          base-api-url: https://example.invalid/api
      - name: Assert action failed regardless of inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected removed action to fail, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
