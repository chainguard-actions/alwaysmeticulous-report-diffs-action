name: Test secure-tunnel-host input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token-for-testing
          app-url: "http://localhost:3000"
          secure-tunnel-host: "tunnel.meticulous.ai"
          github-token: ${{ github.token }}
      - name: Assert action ran (fails gracefully without real API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real API token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
