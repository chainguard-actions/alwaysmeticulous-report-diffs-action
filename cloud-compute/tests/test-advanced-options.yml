name: Test advanced options with unreachable Meticulous API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture HEAD sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 10
        with:
          api-token: "invalid-meticulous-test-token"
          app-url: "http://localhost:3000"
          head-sha: ${{ steps.sha.outputs.sha }}
          secure-tunnel-host: "tunnel.invalid.localhost"
          base-api-url: "http://127.0.0.1:9/api/"
      - name: Assert action failed gracefully against unreachable API
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an unreachable base-api-url and invalid token"
            exit 1
          fi
          echo "PASS"
