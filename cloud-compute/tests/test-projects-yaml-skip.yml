name: Test projects-yaml with skip flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          projects-yaml: |
            app:
              api-token: fake-meticulous-app-token
              app-url: "http://localhost:3000"
              skip: true
      - name: Assert action ran (skipped project should exit cleanly or fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (all projects skipped)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake token or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
