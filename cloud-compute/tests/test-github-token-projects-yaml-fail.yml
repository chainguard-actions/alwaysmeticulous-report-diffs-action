name: Test github-token and projects-yaml inputs still fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          projects-yaml: |
            my-project:
              api-token: dummy
              app-url: http://localhost:3000
      - name: Assert action failed (removed action always fails)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected removed action to fail, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
