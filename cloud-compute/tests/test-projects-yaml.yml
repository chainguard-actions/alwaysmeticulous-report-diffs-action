name: Test projects-yaml multi-project configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          projects-yaml: |
            app:
              api-token: fake-meticulous-app-token
              app-url: "http://localhost:3000"
              skip: false
            admin:
              api-token: fake-meticulous-admin-token
              app-url: "http://localhost:4000"
              skip: false
      - name: Assert action ran and failed gracefully (no valid API tokens in projects-yaml)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API tokens in projects-yaml"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real tokens may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
