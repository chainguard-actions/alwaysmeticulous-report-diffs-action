name: Test projects-yaml input format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          projects-yaml: |
            app:
              api-token: test-invalid-api-token-app
              app-url: "http://localhost:3000"
              skip: false
            admin:
              api-token: test-invalid-api-token-admin
              app-url: "http://localhost:4000"
              skip: false
      - name: Assert action ran (succeeded or failed gracefully with invalid tokens)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid API tokens or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
