name: Test secure-tunnel-host and base-api-url inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-meticulous-token"
          app-url: "http://localhost:3000"
          secure-tunnel-host: "tunnel.example.com"
          base-api-url: "https://api.example.com"
      - name: Assert action ran with secure-tunnel-host and base-api-url inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the API token is fake and the
          # base-api-url points to a non-existent server. What matters is that
          # the action accepted the inputs and ran (not skipped or errored at
          # the workflow level).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with secure-tunnel-host and base-api-url inputs (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
