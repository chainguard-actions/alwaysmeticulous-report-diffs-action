name: Test optional inputs (rewrite-hostname, proxy-all-urls)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-meticulous-token
          app-url: "http://localhost:3000"
          github-token: ${{ github.token }}
          rewrite-hostname-to-app-url: "true"
          proxy-all-urls: "true"
          companion-assets-folder: ""
          companion-assets-regex: ""
      - name: Assert action ran with optional inputs and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Meticulous credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
