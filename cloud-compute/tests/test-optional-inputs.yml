name: Test optional inputs (rewrite-hostname, proxy-all-urls)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "test-invalid-api-token"
          app-url: "http://localhost:3000"
          github-token: ${{ github.token }}
          rewrite-hostname-to-app-url: "true"
          proxy-all-urls: "true"
      - name: Assert action ran (succeeded or failed gracefully with optional inputs set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (invalid API token or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
