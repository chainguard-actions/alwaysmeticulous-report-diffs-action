name: Test optional inputs (rewrite-hostname, proxy-all-urls, head-sha)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-meticulous-api-token
          app-url: "http://localhost:3000"
          github-token: ${{ github.token }}
          rewrite-hostname-to-app-url: "true"
          proxy-all-urls: "true"
          head-sha: "abc1234567890abcdef1234567890abcdef12345"
      - name: Assert action ran and failed gracefully with optional inputs set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API token and optional inputs"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real token may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
