name: Test default github-token - ensure base action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-meticulous-api-token"
          # github-token uses its default value: ${{ github.token }}

      - name: Assert action ran with default github-token (succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with default github-token"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo or fake api-token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
