name: Test ensure-base with explicit ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: dummy-meticulous-api-token
          ref: ${{ steps.head.outputs.sha }}
      - name: Assert action ran (valid outputs, skipped, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUN_ID: ${{ steps.action.outputs.base-workflow-run-id }}
          SHA: ${{ steps.action.outputs.base-commit-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base-workflow-run-id: $RUN_ID"
          echo "base-commit-sha: $SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$RUN_ID" ] && ! echo "$RUN_ID" | grep -qE '^[0-9]+$'; then
              echo "FAIL: base-workflow-run-id is not numeric"
              exit 1
            fi
            if [ -n "$SHA" ] && ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
              echo "FAIL: base-commit-sha is not a 40-char sha"
              exit 1
            fi
            echo "PASS: action succeeded with valid (or no) outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / dummy token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
