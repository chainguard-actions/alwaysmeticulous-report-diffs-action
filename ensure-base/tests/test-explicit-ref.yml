name: Test explicit ref input - ensure base action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-meticulous-api-token
          github-token: ${{ github.token }}
          ref: refs/heads/main

      - name: Assert action ran with explicit ref and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BASE_RUN_ID: ${{ steps.action.outputs.base-workflow-run-id }}
          BASE_COMMIT: ${{ steps.action.outputs.base-commit-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base-workflow-run-id: $BASE_RUN_ID"
          echo "base-commit-sha: $BASE_COMMIT"
          # With a fake API token and sentinel repo, the action is expected to fail.
          # Accept both success (with outputs) and failure (graceful error handling).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake api-token / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
