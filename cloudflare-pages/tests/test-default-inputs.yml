name: Test default inputs - action uses defaults for optional parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: fake-cf-token-defaults
          cloudflare-account-id: fake-account-id-defaults
          cloudflare-project-name: fake-project-defaults
          # Override sleep-seconds to 0 to avoid a 5-minute wait
          sleep-seconds: "0"
          # Override poll and wait to fail fast
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "1"

      - name: Assert action failed gracefully (Cloudflare API unreachable with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake Cloudflare credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
