name: Test fast timeout when deployment not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: "fake-token-for-timeout-test"
          cloudflare-account-id: "fake-account-id"
          cloudflare-project-name: "fake-project-name"
          sleep-seconds: "0"
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "0"

      - name: Assert action timed out and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when deployment was not found within timeout"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with fake credentials and zero timeout"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
