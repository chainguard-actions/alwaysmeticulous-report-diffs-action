name: Test deployment ready (mocked Cloudflare API)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake curl serving a ready Cloudflare Pages deployment
        env:
          SHA: ${{ github.sha }}
        run: |
          FAKE="$RUNNER_TEMP/fakebin"
          mkdir -p "$FAKE"
          cat > "$RUNNER_TEMP/cf-payload.json" <<EOF
          {"success":true,"result":[{"url":"https://abc123.my-project.pages.dev","environment":"preview","latest_stage":{"status":"success"},"deployment_trigger":{"metadata":{"commit_hash":"$SHA"}}}]}
          EOF
          cat > "$FAKE/curl" <<EOF
          #!/bin/sh
          echo "\$*" >> "$RUNNER_TEMP/curl.log"
          case "\$*" in
            *api.cloudflare.com*)
              out=""
              prev=""
              for arg in "\$@"; do
                case "\$prev" in -o|--output) out="\$arg" ;; esac
                prev="\$arg"
              done
              if [ -n "\$out" ]; then cat "$RUNNER_TEMP/cf-payload.json" > "\$out"; else cat "$RUNNER_TEMP/cf-payload.json"; fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "\$@"
          EOF
          chmod +x "$FAKE/curl"
          echo "$FAKE" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: test-cf-token
          cloudflare-account-id: acct123
          cloudflare-project-name: my-project
          sleep-seconds: "0"
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "5"
      - name: Assert action ran (or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          LOG="$RUNNER_TEMP/curl.log"
          if [ -f "$LOG" ]; then
            echo "curl calls:"; cat "$LOG"
            if ! grep -q "accounts/acct123/pages/projects/my-project/deployments" "$LOG"; then
              echo "FAIL: curl not called with expected Cloudflare URL"
              exit 1
            fi
            if ! grep -q "Bearer test-cf-token" "$LOG"; then
              echo "FAIL: curl not called with expected auth header"
              exit 1
            fi
            CALLS=$(grep -c "api.cloudflare.com" "$LOG")
            if [ "$CALLS" -ne 1 ]; then
              echo "FAIL: expected exactly 1 poll (deployment ready immediately), got $CALLS"
              exit 1
            fi
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (GitHub deployment creation on sentinel repo is not possible)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
