name: Test deployment poll timeout behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Record start time
        id: start-time
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: fake-token-for-timeout-test
          cloudflare-account-id: fake-account-id-timeout
          cloudflare-project-name: fake-project-timeout
          sleep-seconds: "0"
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "2"

      - name: Assert action timed out and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          START: ${{ steps.start-time.outputs.ts }}
        run: |
          echo "outcome: $OUTCOME"
          NOW=$(date +%s)
          ELAPSED=$((NOW - START))
          echo "elapsed seconds: $ELAPSED"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (timed out waiting for deployment)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
          # Sanity check: should not have taken more than 60 seconds
          if [ "$ELAPSED" -gt 60 ]; then
            echo "FAIL: action took too long ($ELAPSED seconds), timeout logic may be broken"
            exit 1
          fi
          echo "PASS: completed within reasonable time ($ELAPSED seconds)"
