name: Test timeout - deployment not ready within wait-till-ready-seconds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: "fake-cf-token-timeout"
          cloudflare-account-id: "fake-account-id-timeout"
          cloudflare-project-name: "fake-project-timeout"
          sleep-seconds: "0"
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "0"
      - name: Assert action timed out or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With wait-till-ready-seconds=0 and invalid credentials, the action
          # should fail quickly (either timeout or API error)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (timeout or invalid credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (unexpected but not a test infrastructure failure)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
