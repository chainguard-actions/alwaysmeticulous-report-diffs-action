name: Test deployment never ready times out
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake curl serving no matching deployment
        run: |
          mkdir -p /tmp/fakebin
          rm -f /tmp/fake-curl.log
          echo '{"success":true,"result":[{"url":"https://other.pages.dev","environment":"preview","deployment_trigger":{"metadata":{"commit_hash":"0000000000000000000000000000000000000000"}},"latest_stage":{"status":"success"}}]}' > /tmp/fake-cf-response.json
          cat > /tmp/fakebin/curl <<'EOF'
          #!/bin/sh
          echo "$*" >> /tmp/fake-curl.log
          case "$*" in
            *api.cloudflare.com*)
              cat /tmp/fake-cf-response.json
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          EOF
          chmod +x /tmp/fakebin/curl
          echo "/tmp/fakebin" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: test-cf-token
          cloudflare-account-id: acct123
          cloudflare-project-name: my-project
          sleep-seconds: "0"
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "1"
      - name: Assert action failed (deployment never became ready)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          [ -f /tmp/fake-curl.log ] && cat /tmp/fake-curl.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no deployment matches the commit"
            exit 1
          fi
          echo "PASS"
