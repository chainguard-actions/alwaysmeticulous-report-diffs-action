name: Test timeout - action exits after wait-till-ready-seconds exceeded
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action polls Cloudflare API. With fake credentials and a very short
      # wait-till-ready-seconds, it should time out and exit 1 quickly.
      # The sleep step is skipped because inputs.sleep-time is undefined (the
      # action has a bug: it references inputs.sleep-time but the input is named
      # sleep-seconds), so the condition evaluates to false and sleep is skipped.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: "fake-cloudflare-token-timeout-test"
          cloudflare-account-id: "fake-account-id-timeout"
          cloudflare-project-name: "fake-project-timeout"
          sleep-seconds: "0"
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "1"

      - name: Assert action timed out and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected after timeout with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
