name: Test basic usage - action fails gracefully with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action polls Cloudflare API and will fail because:
      # 1. The fake Cloudflare API token is invalid
      # 2. The wait-till-ready-seconds is set very low so it times out quickly
      # We use continue-on-error and assert it fails gracefully (not a crash)
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          cloudflare-api-token: "fake-cloudflare-token"
          cloudflare-account-id: "fake-account-id"
          cloudflare-project-name: "fake-project"
          sleep-seconds: "0"
          deployment-poll-seconds: "1"
          wait-till-ready-seconds: "2"

      - name: Assert action failed gracefully (invalid Cloudflare credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid Cloudflare credentials / sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
