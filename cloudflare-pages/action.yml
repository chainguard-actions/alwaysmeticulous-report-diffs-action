name: "Meticulous - Create a GitHub deployment from a Cloudflare Pages deployment"
description: "Create a GitHub deployment from a Cloudflare Pages deployment thus triggering Meticulous tests"
inputs:
  github-token:
    description: "A GitHub Actions token (should have write permission on deployments)"
    required: true
  cloudflare-api-token:
    description: "API token for Cloudflare (should have Read permission for Cloudflare Pages)"
    required: true
  cloudflare-account-id:
    description: "Account ID for Cloudflare Pages (from the Workers & Pages section of the dashboard)"
    required: true
  cloudflare-project-name:
    description: "Name of your Cloudflare Pages project (from the Workers & Pages section of the dashboard)"
    required: true
  sleep-seconds:
    description: "Time to sleep before starting to poll deployment status (in seconds)"
    required: false
    default: "300"
  deployment-poll-seconds:
    description: "Time to wait between API calls to poll for the deployment to be ready (in seconds)"
    required: false
    default: "30"
  wait-till-ready-seconds:
    description: "Maximum time to wait for the deployment to be ready (in seconds)"
    required: false
    default: "3600"
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Sleep a bit to wait for the deployment to exist
      if: ${{ inputs.sleep-time != '0' }}
      shell: bash
      env:
        SLEEP_TIME: ${{ inputs.sleep-time }}
      run: sleep "$SLEEP_TIME"
    - name: Wait for deployment to be ready and get URL
      shell: bash
      id: get-deployment
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CLOUDFLARE_PROJECT_NAME: ${{ inputs.cloudflare-project-name }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        WAIT_TILL_READY_SECONDS: ${{ inputs.wait-till-ready-seconds }}
        DEPLOYMENT_POLL_SECONDS: ${{ inputs.deployment-poll-seconds }}
        COMMIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        STATUS="unknown"
        LAST_RESULT=""
        SLEPT=0
        while [[ "$STATUS" != "success" ]]; do
          echo "Checking deployment status..."
          LAST_RESULT=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type:application/json")
          SAFE_SHA=$(printf '%s' "$COMMIT_SHA" | tr -d '\n\r')
          STATUS=$(echo "$LAST_RESULT" | jq -c --arg sha "$SAFE_SHA" 'first(.result[] | select(.deployment_trigger.metadata.commit_hash == $sha) | .latest_stage.status)' --raw-output | tr -d '\n')
          if [[ "$STATUS" != "success" ]]; then
            if [[ $SLEPT -gt $WAIT_TILL_READY_SECONDS ]]; then
              echo "Deployment is still not ready, failing..."
              exit 1
            fi
            echo "Deployment is not ready yet, sleeping..."
            sleep "$DEPLOYMENT_POLL_SECONDS"
            SLEPT=$((SLEPT+DEPLOYMENT_POLL_SECONDS))
          fi
        done
        echo "Deployment is ready!"
        SAFE_SHA=$(printf '%s' "$COMMIT_SHA" | tr -d '\n\r')
        url=$(echo "$LAST_RESULT" | jq -c --arg sha "$SAFE_SHA" 'first(.result[] | select(.deployment_trigger.metadata.commit_hash == $sha) | .url)' --raw-output | tr -d '\n')
        environment=$(echo "$LAST_RESULT" | jq -c --arg sha "$SAFE_SHA" 'first(.result[] | select(.deployment_trigger.metadata.commit_hash == $sha) | .environment)' --raw-output | tr -d '\n')
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "environment=$environment" >> "$GITHUB_OUTPUT"
    - name: Create GitHub deployment from Cloudflare Pages deployment
      uses: altinukshini/deployment-action@fe2fba14b486343ce6893cff73b80e153063917a # releases/v1
      with:
        token: "${{ inputs.github-token }}"
        target_url: "${{ steps.get-deployment.outputs.url }}"
        initial_status: "success"
        environment: "Cloudflare Pages: ${{ inputs.cloudflare-project-name }} (${{ steps.get-deployment.outputs.environment }})"
