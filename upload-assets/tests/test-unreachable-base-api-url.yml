name: Test unreachable base-api-url fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create built assets directory
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          echo '<html><body>hello</body></html>' > "$RUNNER_TEMP/dist/index.html"
          echo "APP_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token-for-testing
          app-directory: ${{ env.APP_DIR }}
          base-api-url: https://meticulous-api.invalid/
          rewrites: '[{"source":"/**","destination":"/index.html"}]'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unreachable API, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
