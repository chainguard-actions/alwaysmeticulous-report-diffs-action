name: Test with base-api-url override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal app directory
        run: |
          mkdir -p /tmp/test-app
          echo "<html><body>Hello</body></html>" > /tmp/test-app/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token-for-testing
          github-token: ${{ github.token }}
          app-directory: /tmp/test-app
          base-api-url: https://app.meticulous.ai

      - name: Assert action ran with base-api-url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the api-token is fake and
          # the sentinel GITHUB_REPOSITORY is not a real repo. We just need
          # to confirm the action ran (not skipped) and that base-api-url
          # was accepted as a valid input (no input validation error).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with base-api-url input (outcome: $OUTCOME)"
