name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal app directory with assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          echo "<html><body>Hello</body></html>" > "$GITHUB_WORKSPACE/dist/index.html"
          echo "body { margin: 0; }" > "$GITHUB_WORKSPACE/dist/style.css"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-api-token-for-testing"
          github-token: ${{ github.token }}
          app-directory: dist

      - name: Assert action ran and failed gracefully with invalid API token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
