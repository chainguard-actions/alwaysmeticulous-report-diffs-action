name: Test invalid API token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create built app directory
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          echo '<html><body>hello</body></html>' > "$RUNNER_TEMP/dist/index.html"
          echo "APP_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          app-directory: ${{ env.APP_DIR }}
          rewrites: '[{"source":"**","destination":"/index.html"}]'
          commit-sha: ${{ github.sha }}
      - name: Assert action ran (rejected the invalid token or completed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUN_ID: ${{ steps.action.outputs.base-workflow-run-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base-workflow-run-id: $RUN_ID"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with an invalid API token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed (no upload performed for this event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
