name: Test with rewrites and commit-sha inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal app directory with assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app-dist"
          echo "<html><body>App</body></html>" > "$GITHUB_WORKSPACE/app-dist/index.html"
          mkdir -p "$GITHUB_WORKSPACE/app-dist/api"
          echo '{"status":"ok"}' > "$GITHUB_WORKSPACE/app-dist/api/health.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-meticulous-token-for-testing"
          github-token: ${{ github.token }}
          app-directory: "${{ github.workspace }}/app-dist"
          rewrites: '[{"source": "/api/:path*", "destination": "/api/:path*"}]'
          commit-sha: "abc1234def5678901234567890123456789012ab"

      - name: Assert action ran and failed gracefully (no real Meticulous token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no valid Meticulous API token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
