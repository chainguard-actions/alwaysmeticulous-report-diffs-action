name: Test with explicit commit SHA
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create app directory with assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app-dist"
          echo "<html><body>App with explicit SHA</body></html>" > "$GITHUB_WORKSPACE/app-dist/index.html"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-api-token-for-testing"
          github-token: ${{ github.token }}
          app-directory: "${{ github.workspace }}/app-dist"
          commit-sha: "abc1234567890abcdef1234567890abcdef12345"

      - name: Assert action ran with explicit commit SHA (fails gracefully with invalid API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
