name: Test explicit commit-sha input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create app directory with sample assets
        run: |
          mkdir -p /tmp/test-app-sha
          echo "<html><body>App with explicit SHA</body></html>" > /tmp/test-app-sha/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "invalid-token-for-testing"
          github-token: ${{ github.token }}
          app-directory: /tmp/test-app-sha
          commit-sha: "abc1234567890abcdef1234567890abcdef12345"

      - name: Assert action ran and failed gracefully with invalid API token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
