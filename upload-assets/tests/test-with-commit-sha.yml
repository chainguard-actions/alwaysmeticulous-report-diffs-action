name: Test with explicit commit-sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake app directory with assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fake-app"
          echo "<html><body>App with commit sha</body></html>" > "$GITHUB_WORKSPACE/fake-app/index.html"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-meticulous-token
          github-token: ${{ github.token }}
          app-directory: fake-app
          commit-sha: abc1234567890abcdef1234567890abcdef1234

      - name: Assert action ran and failed gracefully (invalid API token / sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid API token or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (may have a real token configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
