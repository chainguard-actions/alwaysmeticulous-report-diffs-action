name: Test missing app directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          app-directory: /tmp/this-directory-does-not-exist-12345
      - name: Assert action did not succeed with a missing directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action exited cleanly (no upload performed for this event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
