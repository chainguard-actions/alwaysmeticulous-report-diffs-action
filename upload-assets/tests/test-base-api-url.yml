name: Test base-api-url override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create built app directory
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          echo '<html><body>hello</body></html>' > "$RUNNER_TEMP/dist/index.html"
          echo "APP_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          app-directory: ${{ env.APP_DIR }}
          base-api-url: https://app.meticulous.ai/api/
          commit-sha: ${{ github.sha }}
      - name: Assert action ran with custom base API URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (invalid token against overridden API URL)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
