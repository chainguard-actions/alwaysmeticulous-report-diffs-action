name: Test base-api-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal app directory
        run: |
          mkdir -p /tmp/test-app
          echo "<html><body>Hello</body></html>" > /tmp/test-app/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token-for-testing
          github-token: ${{ github.token }}
          app-directory: /tmp/test-app
          base-api-url: https://app.meticulous.ai
          commit-sha: aabbccddee1122334455667788990011aabbccdd

      - name: Assert action ran with base-api-url input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with base-api-url"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake api-token and sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
