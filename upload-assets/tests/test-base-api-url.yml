name: Test base-api-url override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal app directory
        run: |
          mkdir -p /tmp/test-app
          echo '<html><body>Hello</body></html>' > /tmp/test-app/index.html

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token-for-base-url-test
          github-token: ${{ github.token }}
          app-directory: /tmp/test-app
          base-api-url: https://invalid.example.com/api
          commit-sha: abc1234567890abcdef1234567890abcdef1234

      - name: Assert action ran (fails gracefully with invalid base-api-url and fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid base-api-url and fake token"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
