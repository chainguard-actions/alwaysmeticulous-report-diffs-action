name: Test base workflow run id and base commit sha inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          image-tag: nonexistent-image-for-test:latest
          commit-sha: 0123456789abcdef0123456789abcdef01234567
          base-workflow-run-id: "1234567890"
          base-commit-sha: fedcba9876543210fedcba9876543210fedcba98
      - name: Assert action failed (invalid token / missing image)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid token / missing image"
            exit 1
          fi
          echo "PASS"
