name: Test base workflow run id and base commit sha inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          image-tag: "nonexistent-image-for-act-test:latest"
          container-port: "3000"
          commit-sha: "0123456789abcdef0123456789abcdef01234567"
          base-workflow-run-id: "123456789"
          base-commit-sha: "89abcdef0123456789abcdef0123456789abcdef"
      - name: Assert action failed with invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RUN_ID: ${{ steps.action.outputs.base-workflow-run-id }}
          BASE_SHA: ${{ steps.action.outputs.base-commit-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base-workflow-run-id: $RUN_ID"
          echo "base-commit-sha: $BASE_SHA"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid API token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
