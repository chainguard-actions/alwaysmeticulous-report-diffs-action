name: Test companion-assets-folder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create companion assets folder
        run: |
          mkdir -p /tmp/companion-assets
          echo "hello" > /tmp/companion-assets/index.html
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token
          github-token: ${{ github.token }}
          image-tag: myapp:latest
          companion-assets-folder: /tmp/companion-assets
          companion-assets-regex: "^/static/"
      - name: Assert action ran (fails gracefully without real API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real API token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
