name: Test conflicting companion assets inputs fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create companion asset fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          echo "hello" > "$RUNNER_TEMP/assets/index.js"
          touch "$RUNNER_TEMP/assets.zip"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          image-tag: "nonexistent-image-for-act-test:latest"
          commit-sha: "0123456789abcdef0123456789abcdef01234567"
          companion-assets-folder: ${{ runner.temp }}/assets
          companion-assets-zip: ${{ runner.temp }}/assets.zip
          companion-assets-regex: "^/static/"
      - name: Assert action rejected conflicting inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when both folder and zip are given, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
