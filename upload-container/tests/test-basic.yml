name: Test basic usage - required inputs only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build a minimal dummy Docker image for testing
        run: |
          echo 'FROM alpine:3.18' > /tmp/Dockerfile.test
          echo 'CMD ["echo", "hello"]' >> /tmp/Dockerfile.test
          docker build -f /tmp/Dockerfile.test -t test-app:latest .

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token-for-testing
          github-token: ${{ github.token }}
          image-tag: test-app:latest

      - name: Assert action ran and failed gracefully (no real API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Meticulous API token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (possibly a no-op path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
