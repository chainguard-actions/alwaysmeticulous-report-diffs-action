name: Test companion assets inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal fake Docker image for testing
        run: |
          docker build -t test-app:companion - <<'EOF'
          FROM alpine:3.18
          CMD ["sh", "-c", "echo hello"]
          EOF
      - name: Create a companion assets folder with sample files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/companion-assets"
          echo '<!DOCTYPE html><html><body>Hello</body></html>' > "$GITHUB_WORKSPACE/tests/fixtures/companion-assets/index.html"
          echo 'body { margin: 0; }' > "$GITHUB_WORKSPACE/tests/fixtures/companion-assets/style.css"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-api-token-for-testing"
          github-token: ${{ github.token }}
          image-tag: "test-app:companion"
          companion-assets-folder: "${{ github.workspace }}/tests/fixtures/companion-assets"
          companion-assets-regex: "\\.(html|css|js)$"
      - name: Assert action ran and failed gracefully (no real Meticulous API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real token may have been provided)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake API token and companion assets"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
