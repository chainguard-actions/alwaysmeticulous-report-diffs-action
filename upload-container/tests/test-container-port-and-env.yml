name: Test with container-port and container-env inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pull a small real Docker image to use as image-tag
        run: |
          docker pull hello-world:latest

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-meticulous-token"
          github-token: ${{ github.token }}
          image-tag: "hello-world:latest"
          container-port: "3000"
          container-env: |
            NODE_ENV=production
            APP_MODE=test
          container-health-check-endpoint: "/health"

      - name: Assert action ran and failed gracefully (no real API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real Meticulous API token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real token may be configured)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
