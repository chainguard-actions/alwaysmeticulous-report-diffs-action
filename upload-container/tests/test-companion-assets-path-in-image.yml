name: Test companion assets path in image without regex fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          image-tag: "nonexistent-image-for-act-test:latest"
          commit-sha: "0123456789abcdef0123456789abcdef01234567"
          companion-assets-path-in-image: "/app/dist"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (missing regex / invalid token), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
