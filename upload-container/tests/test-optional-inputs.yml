name: Test optional inputs - commit-sha, container-port, container-env
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal fake Docker image for testing
        run: |
          docker build -t test-app:v1.0.0 - <<'EOF'
          FROM alpine:3.18
          EXPOSE 8080
          CMD ["sh", "-c", "echo hello"]
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-api-token-for-testing"
          github-token: ${{ github.token }}
          image-tag: "test-app:v1.0.0"
          container-port: "8080"
          container-env: |
            NODE_ENV=production
            LOG_LEVEL=info
          container-health-check-endpoint: "/health"
          commit-sha: "abc1234567890abcdef1234567890abcdef12345"
      - name: Assert action ran and failed gracefully (no real Meticulous API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real token may have been provided)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake API token and optional inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
