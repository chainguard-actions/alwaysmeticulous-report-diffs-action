name: Test optional container inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal fake Docker image for testing
        run: |
          docker build -t myapp:optional-test - <<'EOF'
          FROM alpine:3.18
          ENV PORT=8080
          CMD ["sh", "-c", "echo listening on $PORT"]
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token-for-testing
          github-token: ${{ github.token }}
          image-tag: myapp:optional-test
          container-port: "8080"
          container-env: |
            FOO=bar
            BAZ=qux
          container-health-check-endpoint: /health

      - name: Assert action ran and failed gracefully with invalid API token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
