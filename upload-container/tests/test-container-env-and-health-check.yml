name: Test container env and health check inputs with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          image-tag: "nonexistent-image-for-act-test:latest"
          container-port: "8080"
          container-env: |
            FOO=bar
            BAZ=qux
          container-health-check-endpoint: "/health"
          commit-sha: "0123456789abcdef0123456789abcdef01234567"
      - name: Assert action failed (no valid token / image) without crashing on the inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid API token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS"
