name: Test explicit commit SHA input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal fake Docker image for testing
        run: |
          docker build -t myapp:sha-test - <<'EOF'
          FROM alpine:3.18
          CMD ["sh", "-c", "echo hello"]
          EOF

      - name: Get current commit SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-api-token-for-testing
          github-token: ${{ github.token }}
          image-tag: myapp:sha-test
          commit-sha: ${{ steps.get-sha.outputs.sha }}

      - name: Assert action ran with explicit commit SHA (fails gracefully with invalid API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid API token"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
