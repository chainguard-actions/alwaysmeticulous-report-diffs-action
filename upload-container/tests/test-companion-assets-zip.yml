name: Test companion-assets-zip input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake companion assets zip file
        run: |
          echo "fake assets" > /tmp/assets.txt
          zip /tmp/companion-assets.zip /tmp/assets.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: fake-meticulous-token
          github-token: ${{ github.token }}
          image-tag: myapp:latest
          companion-assets-zip: /tmp/companion-assets.zip
          companion-assets-regex: ^/static/
      - name: Assert action ran with companion-assets-zip input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with companion-assets-zip input (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
