name: Test container env, health check, and companion zip inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare companion assets zip
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          echo hello > "$RUNNER_TEMP/assets/index.html"
          cd "$RUNNER_TEMP/assets"
          if command -v zip >/dev/null 2>&1; then
            zip -r "$RUNNER_TEMP/assets.zip" .
          else
            python3 -c "import shutil; shutil.make_archive('$RUNNER_TEMP/assets', 'zip', '$RUNNER_TEMP/assets')"
          fi
          ls -la "$RUNNER_TEMP/assets.zip"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token
          image-tag: nonexistent-image-for-test:latest
          container-port: "8080"
          container-env: |
            FOO=bar
            BAZ=qux
          container-health-check-endpoint: /health
          companion-assets-zip: ${{ runner.temp }}/assets.zip
          companion-assets-regex: "^/static/"
          commit-sha: 0123456789abcdef0123456789abcdef01234567
      - name: Assert action failed (invalid token / missing image)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid token / missing image"
            exit 1
          fi
          echo "PASS"
