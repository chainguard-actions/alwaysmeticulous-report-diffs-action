name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create tests file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/meticulous-test"
          echo '{"testCases": []}' > "$GITHUB_WORKSPACE/meticulous-test/meticulous.json"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: invalid-meticulous-token-for-harness
          app-url: http://localhost:3000
          tests-file: meticulous-test/meticulous.json
          max-retries-on-failure: "0"
      - name: Assert action ran (success, or graceful failure without valid Meticulous credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no valid Meticulous API token in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
