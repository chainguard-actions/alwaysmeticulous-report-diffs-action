name: Test basic usage with app-url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # No real Meticulous API token is available under the harness, and the
      # repository slug is a sentinel, so the action cannot complete its core
      # operation (calling the Meticulous + GitHub APIs). Assert on outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: harness-placeholder-meticulous-token
          app-url: http://localhost:3000
      - name: Assert action ran (success, or failed gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Meticulous token / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
