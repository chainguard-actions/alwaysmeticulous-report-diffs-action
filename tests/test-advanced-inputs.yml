name: Test advanced inputs (localhost-aliases, additional-ports, test-suite-id, tests-file)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a minimal tests file
        run: |
          echo '{"tests": []}' > "$GITHUB_WORKSPACE/meticulous.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-token-for-coverage"
          github-token: ${{ github.token }}
          app-url: "http://localhost:3000"
          tests-file: "${{ github.workspace }}/meticulous.json"
          test-suite-id: "test-suite-coverage"
          localhost-aliases: "app.local,api.local"
          additional-ports: "3001,3002"
          max-retries-on-failure: 0

      - name: Assert action ran (inputs accepted, failed gracefully without valid API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without a valid Meticulous API token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
