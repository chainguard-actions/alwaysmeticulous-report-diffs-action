name: Test custom tuning options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: harness-placeholder-meticulous-token
          app-url: http://localhost:8080
          max-retries-on-failure: "0"
          parallel-tasks: "2"
          localhost-aliases: "app.local,api.local"
          max-allowed-color-difference: "0.05"
          max-allowed-proportion-of-changed-pixels: "0.0001"
          test-suite-id: harness-suite
          additional-ports: "8081,8082"
      - name: Assert action ran (success, or failed gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Meticulous token / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
