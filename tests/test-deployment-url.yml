name: Test use-deployment-url with allowed environments
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Deployment lookup is a repo-scoped GitHub API call keyed on the sentinel
      # GITHUB_REPOSITORY, and no real Meticulous token exists, so assert on outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: harness-placeholder-meticulous-token
          use-deployment-url: "true"
          allowed-environments: |
            preview
            staging
      - name: Assert action ran (success, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / no real token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
