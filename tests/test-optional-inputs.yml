name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a fake tests file
        run: |
          echo '{"tests":[]}' > "$GITHUB_WORKSPACE/meticulous.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-api-token-for-coverage"
          github-token: ${{ github.token }}
          app-url: "http://localhost:3000"
          tests-file: "${{ github.workspace }}/meticulous.json"
          test-suite-id: "coverage-test-suite"
          localhost-aliases: "app.local,api.local"
          additional-ports: "3001,3002"

      - name: Assert action ran (fails gracefully with fake API token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
