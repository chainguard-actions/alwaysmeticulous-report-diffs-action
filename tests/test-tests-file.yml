name: Test tests-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a meticulous tests file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/meticulous-config"
          cat > "$GITHUB_WORKSPACE/meticulous-config/meticulous.json" <<'EOF'
          {
            "tests": []
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: "fake-api-token-for-testing"
          github-token: ${{ github.token }}
          tests-file: "${{ github.workspace }}/meticulous-config/meticulous.json"
          app-url: "http://localhost:3000"

      - name: Assert action ran (tests-file input accepted, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with tests-file input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real API token / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
