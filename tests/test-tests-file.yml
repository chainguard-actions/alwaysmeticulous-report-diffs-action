name: Test explicit tests-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert fixture exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/hardened/tests/fixtures/meticulous.json" ] && [ ! -f "$GITHUB_WORKSPACE/tests/fixtures/meticulous.json" ]; then
            echo "NOTE: fixture not found at expected locations (path layout may differ)"
          fi
          echo "PASS"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-token: harness-placeholder-meticulous-token
          app-url: http://localhost:8080
          tests-file: tests/fixtures/meticulous.json
      - name: Assert action ran (success, or failed gracefully without real credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Meticulous token / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
